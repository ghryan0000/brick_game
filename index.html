<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快打磚塊 - Arkanoid Retro Mobile Deluxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background: #04040c;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            height: 100vh;
            max-width: 480px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 600px) {
            #game-container {
                max-width: 100vw;
                border-radius: 0;
            }
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #151336 0%, #04030f 100%);
            width: 100%;
            height: 100%;
        }

        /* CRT 復古掃描線濾鏡特效 */
        .crt-scanlines::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 8;
        }

        #ui-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }
        .score-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .score-box span {
            color: #00d2ff;
            font-weight: 800;
        }
        .lives-box span {
            color: #ff006e;
            letter-spacing: 1px;
            font-size: 11px;
        }
        #level-badge {
            background: linear-gradient(135deg, #ff006e, #8338ec);
            color: #fff;
            padding: 4px 10px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 0 12px rgba(255, 0, 110, 0.4);
        }
        #crt-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #aaa;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        #crt-btn.active {
            color: #00f5d4;
            border-color: #00f5d4;
            box-shadow: 0 0 8px rgba(0, 245, 212, 0.4);
        }

        /* 底部控制區域 (左右按鈕靠邊) */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px 15px 18px;
            pointer-events: none;
            z-index: 5;
        }
        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px rgba(0, 210, 255, 0.2);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s ease, background 0.1s ease, border-color 0.1s ease;
        }
        .btn:active, .btn.active {
            background: rgba(0, 210, 255, 0.35);
            border-color: #00d2ff;
            transform: scale(0.9);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        }

        /* 特殊雷射與發射按鈕 (出現於右下上方) */
        #action-btn {
            position: absolute;
            bottom: 95px;
            right: 20px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #ff006e, #fb5607);
            border: 2px solid #fff;
            border-radius: 25px;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6);
            display: none;
            cursor: pointer;
            pointer-events: auto;
            z-index: 6;
            animation: pulse-btn 0.8s infinite alternate;
        }
        @keyframes pulse-btn {
            0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(255, 0, 110, 0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 0, 110, 0.9); }
        }

        /* 浮動通知提示 (加命/道具/連擊) */
        #floating-notice {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 800;
            color: #00f5d4;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 7;
            text-align: center;
        }

        /* Overlay 選單與關卡選擇畫面 */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 4, 15, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 16px;
            text-align: center;
        }
        #overlay h1 {
            font-size: 34px;
            font-weight: 800;
            margin: 0 0 4px 0;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
        }
        #overlay p {
            font-size: 13px;
            color: #a0a5c0;
            margin: 0 0 14px 0;
            line-height: 1.4;
        }
        .level-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 14px;
        }
        .level-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .level-card:hover, .level-card.selected {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }
        .level-card .lvl-title {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }
        .level-card .lvl-desc {
            font-size: 10px;
            color: #8fa0c5;
            margin-top: 3px;
        }
        .start-btn {
            background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.6);
        }
        .stats-summary {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="floating-notice"></div>

    <div id="ui-header">
        <div class="score-box">分數: <span id="score">0</span></div>
        <div class="score-box lives-box">生命: <span id="lives">❤️❤️❤️</span></div>
        <div id="level-badge">關卡 1</div>
        <div class="score-box" id="highscore-box" style="cursor: pointer;">最高: <span id="highscore">0</span></div>
        <button id="crt-btn">CRT 濾鏡</button>
    </div>
    
    <div id="overlay">
        <h1 id="overlay-title">快打磚塊</h1>
        <p id="overlay-desc">包含 7 款經典道具膠囊、飛行小兵與 DOH 魔王大戰<br><span style="font-size: 11px; color: #787f9d;">(每場新遊戲具備 3 次生命值 ❤️❤️❤️)</span></p>
        
        <div class="level-grid" id="level-selector">
            <div class="level-card selected" data-level="1">
                <div class="lvl-title">LV 1. 經典初階</div>
                <div class="lvl-desc">標準彩磚 / 道具掉落</div>
            </div>
            <div class="level-card" data-level="2">
                <div class="lvl-title">LV 2. 疾速衝刺</div>
                <div class="lvl-desc">強化粉磚 / 飛行小兵</div>
            </div>
            <div class="level-card" data-level="3">
                <div class="lvl-title">LV 3. 障礙爆破</div>
                <div class="lvl-desc">鋼鐵障礙 / 炸彈連鎖</div>
            </div>
            <div class="level-card" data-level="4">
                <div class="lvl-title">LV 4. 魔王大戰</div>
                <div class="lvl-desc">DOH 摩艾魔王 / 雙彈幕</div>
            </div>
        </div>

        <div id="overlay-stats" class="stats-summary" style="display: none;"></div>
        <button id="start-button" class="start-btn">開始遊戲</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <!-- 額外雷射發射/放球鍵 -->
    <div id="action-btn">🔥 發射雷射</div>

    <!-- 左右控制按鈕 (分立螢幕右下與左下) -->
    <div id="controls">
        <div class="btn" id="leftBtn">←</div>
        <div class="btn" id="rightBtn">→</div>
    </div>
</div>

<script>
const container = document.getElementById('game-container');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highscoreEl = document.getElementById('highscore');
const highscoreBox = document.getElementById('highscore-box');
const levelBadge = document.getElementById('level-badge');
const crtBtn = document.getElementById('crt-btn');
const floatingNotice = document.getElementById('floating-notice');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayDesc = document.getElementById('overlay-desc');
const overlayStats = document.getElementById('overlay-stats');
const startBtn = document.getElementById('start-button');
const actionBtn = document.getElementById('action-btn');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const levelCards = document.querySelectorAll('.level-card');

let highscore = parseInt(localStorage.getItem('brick_highscore') || '0', 10);
highscoreEl.innerText = highscore;

let selectedLevel = 1;
let currentLevel = 1;
let dpr = window.devicePixelRatio || 1;
let width = 0;
let height = 0;

const controlsAreaHeight = 100;

// CRT 街機濾鏡切換
crtBtn.addEventListener('click', () => {
    container.classList.toggle('crt-scanlines');
    crtBtn.classList.toggle('active');
    hapticFeedback(15);
});

// 隱藏彩蛋：點擊最高分 5 次原地接關 (Secret Continue Cheat)
let secretClickCount = 0;
highscoreBox.addEventListener('click', () => {
    secretClickCount++;
    if (secretClickCount >= 5) {
        secretClickCount = 0;
        showNotice('🔓 隱藏接關已解鎖！', '#00f5d4');
        playSound(880, 'sine', 0.3, 0.2);
    }
});

function showNotice(text, color = '#00f5d4') {
    floatingNotice.innerText = text;
    floatingNotice.style.color = color;
    floatingNotice.style.opacity = '1';
    floatingNotice.style.transform = 'translate(-50%, -60%) scale(1.1)';
    setTimeout(() => {
        floatingNotice.style.opacity = '0';
        floatingNotice.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 1200);
}

function hapticFeedback(pattern) {
    if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e){}
    }
}

function resize() {
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    if (ctx.resetTransform) ctx.resetTransform();
    else ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    if (paddle) {
        paddle.y = height - controlsAreaHeight - paddle.height - 15;
        if (paddle.x > width - paddle.width) {
            paddle.x = Math.max(0, width - paddle.width);
        }
    }
}
window.addEventListener('resize', resize);

// Web Audio API
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(freq, type, duration, volume = 0.1) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq / 2), audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function playCustomLevelSound(soundType) {
    if (soundType === 'brick') {
        if (currentLevel === 1) playSound(650, 'sine', 0.08, 0.12);
        else if (currentLevel === 2) playSound(850, 'square', 0.06, 0.1);
        else if (currentLevel === 3) playSound(450, 'triangle', 0.1, 0.15);
        else if (currentLevel === 4) playSound(350, 'sawtooth', 0.08, 0.12);
    } else if (soundType === 'powerup') {
        playSound(900, 'sine', 0.15, 0.18);
        setTimeout(() => playSound(1200, 'sine', 0.2, 0.18), 100);
    } else if (soundType === 'laser') {
        playSound(1100, 'sawtooth', 0.08, 0.15);
    } else if (soundType === 'bomb') {
        playSound(120, 'sawtooth', 0.35, 0.25);
    } else if (soundType === 'steel') {
        playSound(200, 'square', 0.05, 0.1);
    } else if (soundType === 'bossHit') {
        playSound(180, 'sawtooth', 0.15, 0.2);
    } else if (soundType === 'paddle') {
        playSound(440, 'square', 0.08, 0.1);
    } else if (soundType === 'wall') {
        playSound(320, 'triangle', 0.05, 0.08);
    } else if (soundType === 'lifeLost') {
        playSound(160, 'sawtooth', 0.25, 0.2);
    } else if (soundType === '1up') {
        playSound(523, 'sine', 0.1, 0.2);
        setTimeout(() => playSound(659, 'sine', 0.1, 0.2), 100);
        setTimeout(() => playSound(784, 'sine', 0.25, 0.2), 200);
    }
}

// 遊戲狀態物件
let balls = [];
let paddle = { 
    width: 80, 
    baseWidth: 80, 
    height: 12, 
    x: 0, 
    y: 0, 
    color: '#00d2ff', 
    speed: 8,
    laserMode: false,
    catchMode: false,
    expandTimer: null
};
let bricks = [];
let particles = [];
let capsules = [];
let lasers = [];
let enemies = [];
let enemyTimer = null;
let boss = null;
let bossProjectiles = [];
let warpGate = null;

let lives = 3;
let score = 0;
let nextLifeScore = 20000;
let comboStreak = 0;
let gameRunning = false;
let animationId = null;

let brickRowCount = 5;
let brickColumnCount = 5;
let brickWidth = 0;
let brickHeight = 20;
let brickPadding = 8;
let brickOffsetTop = 65;
let brickOffsetLeft = 15;

// 關卡卡片點擊
levelCards.forEach(card => {
    card.addEventListener('click', () => {
        levelCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedLevel = parseInt(card.dataset.level, 10);
    });
});

function createParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            dx: (Math.random() - 0.5) * 7,
            dy: (Math.random() - 0.5) * 7,
            radius: Math.random() * 3 + 1,
            color: color,
            alpha: 1,
            life: 20 + Math.random() * 15
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 1 / p.life;
        if (p.alpha <= 0) particles.splice(i, 1);
        else {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        }
    }
}

function updateLivesUI() {
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '❤️';
    livesEl.innerText = hearts || '💀';
}

function checkScoreMilestone(added) {
    score += added;
    scoreEl.innerText = score;
    if (score >= nextLifeScore) {
        lives++;
        updateLivesUI();
        showNotice('+1 額外生命 ❤️ (達成里程碑)', '#ff006e');
        playCustomLevelSound('1up');
        hapticFeedback([50, 80, 50]);
        nextLifeScore += nextLifeScore === 20000 ? 40000 : 60000;
    }
}

function createBall(isMain = false) {
    let baseSpeed = 5.5 + (currentLevel - 1) * 0.8;
    let angle = (Math.random() * 0.6 - 0.3) * Math.PI;
    return {
        x: width / 2,
        y: height - controlsAreaHeight - 60,
        radius: 7.5,
        dx: baseSpeed * Math.sin(angle) || 3,
        dy: -Math.abs(baseSpeed * Math.cos(angle)),
        speed: baseSpeed,
        stuck: false,
        stuckOffset: 0
    };
}

function resetBallAndPaddle() {
    balls = [createBall(true)];
    paddle.x = (width - paddle.width) / 2;
    paddle.laserMode = false;
    paddle.catchMode = false;
    actionBtn.style.display = 'none';
    warpGate = null;
}

// 道具膠囊掉落系統 (L, E, C, D, S, B, P)
const CAPSULE_TYPES = [
    { type: 'L', letter: 'L', color: '#ff5400', label: '雷射砲 (Laser)' },
    { type: 'E', letter: 'E', color: '#3a86ff', label: '擴大板 (Expand)' },
    { type: 'C', letter: 'C', color: '#00f5d4', label: '黏球磁力 (Catch)' },
    { type: 'D', letter: 'D', color: '#00d2ff', label: '三球分裂 (Disrupt)' },
    { type: 'S', letter: 'S', color: '#ffbe0b', label: '減速球 (Slow)' },
    { type: 'B', letter: 'B', color: '#ff006e', label: '跳關門 (Break)' },
    { type: 'P', letter: 'P', color: '#a0aec0', label: '+1 生命 (1UP)' }
];

function spawnCapsule(x, y) {
    if (Math.random() > 0.28) return; // 28% 掉落機率
    let item = CAPSULE_TYPES[Math.floor(Math.random() * CAPSULE_TYPES.length)];
    capsules.push({
        x: x, y: y,
        width: 32, height: 16,
        type: item.type,
        letter: item.letter,
        color: item.color,
        label: item.label,
        dy: 2.2
    });
}

function applyPowerup(type, label) {
    playCustomLevelSound('powerup');
    hapticFeedback(30);
    showNotice(`✨ ${label}`, '#00d2ff');

    if (type === 'L') {
        paddle.laserMode = true;
        actionBtn.innerText = '🔥 發射雷射';
        actionBtn.style.display = 'block';
    } else if (type === 'E') {
        paddle.width = paddle.baseWidth * 1.5;
        if (paddle.expandTimer) clearTimeout(paddle.expandTimer);
        paddle.expandTimer = setTimeout(() => { paddle.width = paddle.baseWidth; }, 18000);
    } else if (type === 'C') {
        paddle.catchMode = true;
        showNotice('🧲 磁力黏球啟用', '#00f5d4');
    } else if (type === 'D') {
        if (balls.length > 0) {
            let b = balls[0];
            balls.push({ ...b, dx: b.dx - 2.5, dy: -Math.abs(b.dy), stuck: false });
            balls.push({ ...b, dx: b.dx + 2.5, dy: -Math.abs(b.dy), stuck: false });
        }
    } else if (type === 'S') {
        balls.forEach(b => {
            b.dx = (b.dx > 0 ? 1 : -1) * 3.5;
            b.dy = (b.dy > 0 ? 1 : -1) * 3.5;
        });
    } else if (type === 'B') {
        warpGate = { x: width - 25, y: height / 2 - 40, width: 25, height: 80 };
        showNotice('🚪 右側傳送門已開啟！', '#ff006e');
    } else if (type === 'P') {
        lives++;
        updateLivesUI();
        playCustomLevelSound('1up');
    }
}

// 飛行小兵生成 (Roaming Enemies)
function spawnEnemy() {
    if (!gameRunning || currentLevel === 1) return;
    enemies.push({
        x: Math.random() * (width - 40) + 20,
        y: 60,
        radius: 12,
        angle: 0,
        speed: 1.2,
        color: '#ffbe0b',
        hp: 1
    });
}

function fireLaser() {
    if (!paddle.laserMode || !gameRunning) return;
    lasers.push({ x: paddle.x + 8, y: paddle.y - 8, dy: -9, width: 3, height: 12 });
    lasers.push({ x: paddle.x + paddle.width - 11, y: paddle.y - 8, dy: -9, width: 3, height: 12 });
    playCustomLevelSound('laser');
    hapticFeedback(12);
}

function releaseStuckBalls() {
    balls.forEach(b => {
        if (b.stuck) {
            b.stuck = false;
            b.dy = -Math.abs(b.speed || 5);
        }
    });
    actionBtn.style.display = paddle.laserMode ? 'block' : 'none';
}

actionBtn.addEventListener('click', () => {
    initAudio();
    if (paddle.laserMode) fireLaser();
    releaseStuckBalls();
});

function initGame() {
    currentLevel = selectedLevel;
    levelBadge.innerText = `關卡 ${currentLevel}`;
    resize();
    
    lives = 3;
    updateLivesUI();
    nextLifeScore = 20000;
    comboStreak = 0;

    paddle.baseWidth = Math.max(65, Math.min(85, width * 0.22));
    paddle.width = paddle.baseWidth;
    paddle.y = height - controlsAreaHeight - paddle.height - 15;
    
    resetBallAndPaddle();

    brickColumnCount = currentLevel === 2 ? 6 : 5;
    brickRowCount = currentLevel === 4 ? 2 : (currentLevel === 2 ? 6 : 5);
    brickWidth = (width - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
    
    bricks = [];
    boss = null;
    capsules = [];
    lasers = [];
    enemies = [];
    bossProjectiles = [];
    warpGate = null;

    if (enemyTimer) clearInterval(enemyTimer);
    enemyTimer = setInterval(spawnEnemy, 12000);

    const colors = ['#ff006e', '#fb5607', '#ffbe0b', '#3a86ff', '#8338ec', '#00f5d4'];
    
    if (currentLevel === 4) {
        // Level 4: DOH 摩艾魔王戰
        boss = {
            x: width / 2 - 60,
            y: 65,
            width: 120,
            height: 38,
            hp: 25,
            maxHp: 25,
            dx: 2.2,
            shootTimer: 0,
            color: '#ff0055'
        };
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < 2; r++) {
                bricks[c][r] = {
                    x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                    y: r * (brickHeight + brickPadding) + 125,
                    status: 1,
                    type: 'normal',
                    hp: 1,
                    color: '#8338ec',
                    scoreVal: 100
                };
            }
        }
    } else {
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                let type = 'normal';
                let hp = 1;
                let color = colors[r % colors.length];
                let scoreVal = 50 + r * 10;

                if (currentLevel === 2 && (r === 0 || r === 1)) {
                    type = 'tough';
                    hp = 2;
                    color = '#ff006e';
                    scoreVal = 150;
                } else if (currentLevel === 3) {
                    if (r === 2 && (c === 1 || c === 3)) {
                        type = 'steel';
                        color = '#718096';
                    } else if (r === 1 && c === 2) {
                        type = 'bomb';
                        color = '#ffbe0b';
                        scoreVal = 200;
                    }
                }

                bricks[c][r] = {
                    x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                    y: r * (brickHeight + brickPadding) + brickOffsetTop,
                    status: 1,
                    type: type,
                    hp: hp,
                    color: color,
                    scoreVal: scoreVal
                };
            }
        }
    }

    score = 0;
    scoreEl.innerText = score;
    particles = [];
}

// 觸控雙重控制：微移單步與長按連續滑動
const keys = {};
let tapStep = 22;

function handleButtonDown(dir) {
    initAudio();
    if (dir === 'left') {
        paddle.x = Math.max(0, paddle.x - tapStep);
        keys['ArrowLeft'] = true;
        leftBtn.classList.add('active');
    } else if (dir === 'right') {
        paddle.x = Math.min(width - paddle.width, paddle.x + tapStep);
        keys['ArrowRight'] = true;
        rightBtn.classList.add('active');
    }
}

function handleButtonUp(dir) {
    if (dir === 'left') {
        keys['ArrowLeft'] = false;
        leftBtn.classList.remove('active');
    } else if (dir === 'right') {
        keys['ArrowRight'] = false;
        rightBtn.classList.remove('active');
    }
}

leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonDown('left'); });
leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleButtonUp('left'); });
leftBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); handleButtonUp('left'); });

rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonDown('right'); });
rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleButtonUp('right'); });
rightBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); handleButtonUp('right'); });

leftBtn.addEventListener('mousedown', () => handleButtonDown('left'));
leftBtn.addEventListener('mouseup', () => handleButtonUp('left'));
leftBtn.addEventListener('mouseleave', () => handleButtonUp('left'));

rightBtn.addEventListener('mousedown', () => handleButtonDown('right'));
rightBtn.addEventListener('mouseup', () => handleButtonUp('right'));
rightBtn.addEventListener('mouseleave', () => handleButtonUp('right'));

window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) keys[e.code] = true;
    if (e.code === 'Space') {
        if (paddle.laserMode) fireLaser();
        releaseStuckBalls();
    }
});
window.addEventListener('keyup', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) keys[e.code] = false;
});

// Canvas 手勢滑動
let isDragging = false;
canvas.addEventListener('touchstart', (e) => {
    if (!gameRunning) return;
    isDragging = true;
    movePaddleWithTouch(e.touches[0].clientX);
    releaseStuckBalls();
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
    if (!gameRunning || !isDragging) return;
    movePaddleWithTouch(e.touches[0].clientX);
}, { passive: true });

canvas.addEventListener('touchend', () => { isDragging = false; });

function movePaddleWithTouch(clientX) {
    const rect = canvas.getBoundingClientRect();
    const touchX = clientX - rect.left;
    paddle.x = Math.max(0, Math.min(width - paddle.width, touchX - paddle.width / 2));
}

startBtn.addEventListener('click', startGame);

function startGame() {
    initAudio();
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    overlay.style.display = 'none';
    gameRunning = true;
    initGame();
    draw();
}

function gameOver(isWin) {
    gameRunning = false;
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    if (enemyTimer) clearInterval(enemyTimer);

    if (score > highscore) {
        highscore = score;
        localStorage.setItem('brick_highscore', highscore);
        highscoreEl.innerText = highscore;
    }

    if (isWin) {
        playSound(600, 'sine', 0.1);
        setTimeout(() => playSound(850, 'sine', 0.25), 100);
        overlayTitle.innerText = "🎉 關卡通關！";
        overlayDesc.innerText = `恭喜擊破 ${levelBadge.innerText} 所有目標！`;
    } else {
        playSound(140, 'sawtooth', 0.4);
        overlayTitle.innerText = "💥 挑戰失敗";
        overlayDesc.innerText = "生命值已耗盡，調整節奏再試一次！";
    }

    overlayStats.style.display = 'block';
    overlayStats.innerHTML = `本次得分: <span style="color:#00d2ff">${score}</span>`;
    startBtn.innerText = isWin && selectedLevel < 4 ? "進入下一關" : "再試一次";
    
    if (isWin && selectedLevel < 4) {
        selectedLevel++;
        levelCards.forEach(c => c.classList.remove('selected'));
        document.querySelector(`.level-card[data-level="${selectedLevel}"]`).classList.add('selected');
    }
    overlay.style.display = 'flex';
}

function triggerBombExplosion(centerC, centerR) {
    playCustomLevelSound('bomb');
    hapticFeedback([40, 60, 40]);
    for (let c = Math.max(0, centerC - 1); c <= Math.min(brickColumnCount - 1, centerC + 1); c++) {
        if (!bricks[c]) continue;
        for (let r = Math.max(0, centerR - 1); r <= Math.min(brickRowCount - 1, centerR + 1); r++) {
            let target = bricks[c][r];
            if (target && target.status === 1 && target.type !== 'steel') {
                target.status = 0;
                checkScoreMilestone(25);
                createParticles(target.x + brickWidth / 2, target.y + brickHeight / 2, '#ffbe0b', 15);
            }
        }
    }
}

function collisionDetection() {
    let activeBreakables = 0;

    // Boss 碰撞
    if (boss && boss.hp > 0) {
        balls.forEach(ball => {
            if (ball.x + ball.radius > boss.x && ball.x - ball.radius < boss.x + boss.width &&
                ball.y + ball.radius > boss.y && ball.y - ball.radius < boss.y + boss.height) {
                ball.dy = -ball.dy;
                boss.hp--;
                checkScoreMilestone(200);
                createParticles(ball.x, ball.y, '#ff0055', 12);
                playCustomLevelSound('bossHit');
                hapticFeedback(25);
                if (boss.hp <= 0) {
                    gameOver(true);
                    return;
                }
            }
        });
    }

    // 磚塊碰撞走查
    for (let c = 0; c < brickColumnCount; c++) {
        if (!bricks[c]) continue;
        for (let r = 0; r < brickRowCount; r++) {
            let b = bricks[c][r];
            if (b && b.status === 1) {
                if (b.type !== 'steel') activeBreakables++;

                balls.forEach(ball => {
                    if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + brickWidth && 
                        ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + brickHeight) {
                        
                        ball.dy = -ball.dy;

                        if (b.type === 'steel') {
                            playCustomLevelSound('steel');
                            createParticles(ball.x, ball.y, '#a0aec0', 5);
                            hapticFeedback(10);
                        } else if (b.type === 'bomb') {
                            b.status = 0;
                            triggerBombExplosion(c, r);
                        } else {
                            b.hp--;
                            if (b.hp <= 0) {
                                b.status = 0;
                                comboStreak++;
                                let comboBonus = comboStreak > 3 ? 1.5 : 1;
                                checkScoreMilestone(Math.floor(b.scoreVal * comboBonus));
                                createParticles(b.x + brickWidth / 2, b.y + brickHeight / 2, b.color);
                                playCustomLevelSound('brick');
                                hapticFeedback(12);
                                spawnCapsule(b.x + brickWidth / 2, b.y + brickHeight / 2);
                            } else {
                                b.color = '#ff66a5'; // 裂痕變色
                                playCustomLevelSound('brick');
                            }
                        }

                        if (currentLevel !== 4 && activeBreakables - 1 <= 0) {
                            gameOver(true);
                            return;
                        }
                    }
                });
            }
        }
    }
}

function draw() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, width, height);

    // 擋板移動
    if ((keys['ArrowLeft'] || keys['KeyA']) && paddle.x > 0) paddle.x -= paddle.speed;
    if ((keys['ArrowRight'] || keys['KeyD']) && paddle.x < width - paddle.width) paddle.x += paddle.speed;

    // 繪製 Boss DOH
    if (boss && boss.hp > 0) {
        boss.x += boss.dx;
        if (boss.x + boss.width > width - 10 || boss.x < 10) boss.dx = -boss.dx;

        // DOH 摩艾頭像造型
        ctx.save();
        ctx.fillStyle = boss.color;
        ctx.shadowColor = boss.color;
        ctx.shadowBlur = 18;
        ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        
        // 眼睛發光
        ctx.fillStyle = '#00f5d4';
        ctx.shadowColor = '#00f5d4';
        ctx.fillRect(boss.x + 25, boss.y + 8, 14, 8);
        ctx.fillRect(boss.x + boss.width - 39, boss.y + 8, 14, 8);

        // Boss 血條
        let hpRatio = boss.hp / boss.maxHp;
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(boss.x, boss.y - 12, boss.width, 6);
        ctx.fillStyle = '#00d2ff';
        ctx.fillRect(boss.x, boss.y - 12, boss.width * hpRatio, 6);
        ctx.restore();

        // Boss 發射彈幕
        boss.shootTimer++;
        if (boss.shootTimer > 160) {
            boss.shootTimer = 0;
            bossProjectiles.push({ x: boss.x + 30, y: boss.y + boss.height, dy: 3.5, radius: 5 });
            bossProjectiles.push({ x: boss.x + boss.width - 30, y: boss.y + boss.height, dy: 3.5, radius: 5 });
            playSound(220, 'sawtooth', 0.1, 0.15);
        }
    }

    // 更新與繪製 Boss 彈幕
    for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        let p = bossProjectiles[i];
        p.y += p.dy;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.fill();

        // 擊中擋板
        if (p.y >= paddle.y && p.y <= paddle.y + paddle.height && p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
            bossProjectiles.splice(i, 1);
            hapticFeedback([30, 40, 30]);
            playCustomLevelSound('lifeLost');
            showNotice('⚠️ 遭受魔王電漿打擊！', '#ff0055');
        } else if (p.y > height) {
            bossProjectiles.splice(i, 1);
        }
    }

    // 繪製磚塊
    for (let c = 0; c < brickColumnCount; c++) {
        if (!bricks[c]) continue;
        for (let r = 0; r < brickRowCount; r++) {
            let b = bricks[c][r];
            if (b && b.status === 1) {
                ctx.save();
                ctx.beginPath();
                let rx = b.x, ry = b.y, rw = brickWidth, rh = brickHeight, rad = 4;
                ctx.moveTo(rx + rad, ry);
                ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rad);
                ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rad);
                ctx.arcTo(rx, ry + rh, rx, ry, rad);
                ctx.arcTo(rx, ry, rx + rw, ry, rad);
                ctx.closePath();

                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = b.type === 'bomb' ? 12 : 6;
                ctx.fill();

                if (b.type === 'steel') {
                    ctx.fillStyle = '#cbd5e0';
                    ctx.fillRect(rx + rw / 4, ry + rh / 4, rw / 2, rh / 2);
                } else if (b.type === 'bomb') {
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('💣', rx + rw / 2, ry + rh / 2 + 4);
                }
                ctx.restore();
            }
        }
    }

    // 繪製傳送門 (Break Portal)
    if (warpGate) {
        ctx.save();
        ctx.fillStyle = '#ff006e';
        ctx.shadowColor = '#ff006e';
        ctx.shadowBlur = 20;
        ctx.fillRect(warpGate.x, warpGate.y, warpGate.width, warpGate.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('WARP', warpGate.x + 2, warpGate.y + 45);
        ctx.restore();
    }

    // 更新與繪製道具膠囊
    for (let i = capsules.length - 1; i >= 0; i--) {
        let cap = capsules[i];
        cap.y += cap.dy;
        ctx.save();
        ctx.fillStyle = cap.color;
        ctx.shadowColor = cap.color;
        ctx.shadowBlur = 10;
        // 繪製圓角膠囊
        ctx.beginPath();
        ctx.roundRect(cap.x - cap.width/2, cap.y - cap.height/2, cap.width, cap.height, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cap.letter, cap.x, cap.y + 4);
        ctx.restore();

        // 擋板接住膠囊
        if (cap.y + cap.height/2 >= paddle.y && cap.y - cap.height/2 <= paddle.y + paddle.height &&
            cap.x >= paddle.x && cap.x <= paddle.x + paddle.width) {
            applyPowerup(cap.type, cap.label);
            capsules.splice(i, 1);
        } else if (cap.y > height) {
            capsules.splice(i, 1);
        }
    }

    // 更新與繪製雷射光束
    for (let i = lasers.length - 1; i >= 0; i--) {
        let l = lasers[i];
        l.y += l.dy;
        ctx.fillStyle = '#ff006e';
        ctx.shadowColor = '#ff006e';
        ctx.shadowBlur = 10;
        ctx.fillRect(l.x, l.y, l.width, l.height);

        // 雷射擊中磚塊
        for (let c = 0; c < brickColumnCount; c++) {
            if (!bricks[c]) continue;
            for (let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if (b && b.status === 1 && b.type !== 'steel') {
                    if (l.x >= b.x && l.x <= b.x + brickWidth && l.y >= b.y && l.y <= b.y + brickHeight) {
                        b.hp--;
                        if (b.hp <= 0) {
                            b.status = 0;
                            checkScoreMilestone(b.scoreVal);
                            createParticles(b.x + brickWidth/2, b.y + brickHeight/2, b.color);
                            spawnCapsule(b.x + brickWidth/2, b.y + brickHeight/2);
                        }
                        lasers.splice(i, 1);
                        break;
                    }
                }
            }
        }
        if (l.y < 0) lasers.splice(i, 1);
    }

    // 更新與繪製飛行小兵 (Roaming Enemies)
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        en.angle += 0.04;
        en.y += en.speed;
        en.x += Math.sin(en.angle) * 2;

        ctx.save();
        ctx.beginPath();
        ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
        ctx.fillStyle = en.color;
        ctx.shadowColor = en.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();

        // 球擊中小兵
        balls.forEach(ball => {
            let dist = Math.hypot(ball.x - en.x, ball.y - en.y);
            if (dist < ball.radius + en.radius) {
                createParticles(en.x, en.y, en.color, 12);
                checkScoreMilestone(100);
                playSound(500, 'sine', 0.1);
                hapticFeedback(15);
                ball.dx = -ball.dx;
                enemies.splice(i, 1);
            }
        });

        if (en.y > height) enemies.splice(i, 1);
    }

    // 繪製粒子效果
    updateParticles();

    // 繪製擋板 (Vaus 飛船)
    ctx.save();
    ctx.beginPath();
    let px = paddle.x, py = paddle.y, pw = paddle.width, ph = paddle.height, prad = 6;
    ctx.moveTo(px + prad, py);
    ctx.arcTo(px + pw, py, px + pw, py + ph, prad);
    ctx.arcTo(px + pw, py + ph, px, py + ph, prad);
    ctx.arcTo(px, py + ph, px, py, prad);
    ctx.arcTo(px, py, px + pw, py, prad);
    ctx.closePath();
    
    let paddleGradient = ctx.createLinearGradient(px, py, px + pw, py);
    paddleGradient.addColorStop(0, paddle.laserMode ? '#ff5400' : '#00d2ff');
    paddleGradient.addColorStop(1, paddle.laserMode ? '#ff006e' : '#0072ff');
    ctx.fillStyle = paddleGradient;
    ctx.shadowColor = paddle.laserMode ? '#ff5400' : '#00d2ff';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.restore();

    // 更新並繪製所有球體 (支援多球分裂)
    for (let i = balls.length - 1; i >= 0; i--) {
        let ball = balls[i];

        if (ball.stuck) {
            ball.x = paddle.x + ball.stuckOffset;
            ball.y = paddle.y - ball.radius;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff006e';
        ctx.shadowColor = '#ff006e';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.closePath();
        ctx.restore();

        if (!ball.stuck) {
            // 牆壁碰撞
            if (ball.x + ball.dx > width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
                playCustomLevelSound('wall');
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
                playCustomLevelSound('wall');
            } 
            // 擋板碰撞
            else if (ball.y + ball.dy >= paddle.y - ball.radius && ball.y <= paddle.y + paddle.height) {
                if (ball.x >= paddle.x - ball.radius && ball.x <= paddle.x + paddle.width + ball.radius) {
                    comboStreak = 0; // 重置連擊

                    if (paddle.catchMode) {
                        ball.stuck = true;
                        ball.stuckOffset = ball.x - paddle.x;
                        actionBtn.innerText = '🚀 發射彈珠';
                        actionBtn.style.display = 'block';
                    } else {
                        ball.dy = -Math.abs(ball.dy);
                        let collidePoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        let bounceAngle = collidePoint * (Math.PI / 3);
                        let currentSpeed = Math.hypot(ball.dx, ball.dy);
                        
                        ball.dx = currentSpeed * Math.sin(bounceAngle);
                        ball.dy = -currentSpeed * Math.cos(bounceAngle);
                        
                        if (Math.abs(ball.dx) < 1.5) ball.dx = ball.dx < 0 ? -1.5 : 1.5;
                        playCustomLevelSound('paddle');
                    }
                }
            } 
            // 傳送門過關判定
            if (warpGate && ball.x >= warpGate.x && ball.y >= warpGate.y && ball.y <= warpGate.y + warpGate.height) {
                checkScoreMilestone(10000);
                showNotice('🎉 成功跳關！ +10,000分', '#00f5d4');
                gameOver(true);
                return;
            }

            // 底部掉落
            if (ball.y + ball.dy > height - controlsAreaHeight - ball.radius) {
                balls.splice(i, 1);
            } else {
                ball.x += ball.dx;
                ball.y += ball.dy;
            }
        }
    }

    // 所有球皆掉落時扣生命值
    if (balls.length === 0) {
        lives--;
        updateLivesUI();
        playCustomLevelSound('lifeLost');
        hapticFeedback([50, 80, 50]);

        if (lives <= 0) {
            gameOver(false);
            return;
        } else {
            showNotice(`💔 損失 1 命！ 剩餘 ${lives} 次`, '#ff0055');
            resetBallAndPaddle();
        }
    }

    collisionDetection();

    if (gameRunning) {
        animationId = requestAnimationFrame(draw);
    }
}
</script>
</body>
</html>
